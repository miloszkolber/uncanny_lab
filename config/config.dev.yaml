server:
  address: 127.0.0.1
  port: 8080

runtime:
  device: cpu
  python_executable: python3
  python_path: /workspace/uncanny-lab/python
  default_precision: fp32

paths:
  data: /tmp/uncanny-lab
  models: /tmp/uncanny-lab/models
  inputs: /tmp/uncanny-lab/inputs
  workspace: /tmp/uncanny-lab/workspace
  manifests: /workspace/uncanny-lab/manifests/engines
  ui_library: /workspace/ui_library

previews:
  enabled: true
  every_steps: 5

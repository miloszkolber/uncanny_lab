server:
  address: 0.0.0.0
  port: 8080

runtime:
  device: xpu
  python_executable: python3
  python_path: /app/python
  default_precision: fp32

paths:
  models: /models
  inputs: /inputs
  outputs: /outputs
  workspace: /workspace
  manifests: /app/manifests/engines

previews:
  enabled: true
  every_steps: 5

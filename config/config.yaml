server:
  address: 0.0.0.0
  port: 8080

runtime:
  device: xpu
  python_executable: python3
  python_path: /opt/venv/lib/python3.12/site-packages
  default_precision: fp32

paths:
  data: /data
  models: /data/models
  inputs: /data/inputs
  workspace: /data/workspace
  manifests: /app/manifests/engines

previews:
  enabled: true
  every_steps: 5

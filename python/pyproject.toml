[project]
name = "uncanny-lab"
version = "0.1.3"
description = "Replaceable optimization-based image workers for Uncanny Lab"
requires-python = ">=3.11"
dependencies = ["torch>=2.11,<2.12", "torchvision>=0.26,<0.27", "Pillow>=12,<13", "open_clip_torch==3.3.0"]

[project.optional-dependencies]
test = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uncanny_lab"]

services:
    uncanny-lab:
        container_name: uncanny-lab
        image: core/uncanny-lab
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        user: "1000:1000"
        read_only: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        pids_limit: 512
        devices:
            - /dev/dri/renderD128:/dev/dri/renderD128
        group_add:
            - "${RENDER_GID:-991}"
        shm_size: 2gb
        environment:
            TZ: Europe/Warsaw
            XPU_VISIBLE_DEVICES: "0"
            PYTHONUNBUFFERED: "1"
            PYTHONDONTWRITEBYTECODE: "1"
            HOME: /tmp
            XDG_CACHE_HOME: /data/cache
            HF_HUB_OFFLINE: "1"
            HF_HUB_DISABLE_TELEMETRY: "1"
        volumes:
            - /var/lib/uncanny-lab:/data
            - /workspace/ui_library:/ui-library:ro
        tmpfs:
            - /tmp:size=1g,mode=1777
            - /run:size=16m,mode=0755
        ports:
            - "127.0.0.1:8080:8080"
        healthcheck:
            test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 10s

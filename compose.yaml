services:
    uncanny-lab:
        image: "${UNCANNY_IMAGE:-ghcr.io/miloszkolber/uncanny-lab:0.1.2}"
        build:
            context: .
            additional_contexts:
                mewa_ui: ../mewa_ui
        restart: unless-stopped
        user: "${UNCANNY_UID:-1000}:${UNCANNY_GID:-1000}"
        init: true
        read_only: true
        devices:
            - "${UNCANNY_RENDER_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128"
        group_add:
            - "${RENDER_GID:-991}"
        shm_size: 2gb
        environment:
            TZ: UTC
            XPU_VISIBLE_DEVICES: "0"
            UNCANNY_DEVICE: "${UNCANNY_DEVICE:-xpu}"
            HOME: /tmp
            XDG_CACHE_HOME: /data/cache
            UNCANNY_PORT: "${UNCANNY_PORT:-8080}"
            UNCANNY_ENABLE_CHECKPOINT_DOWNLOADS: "${UNCANNY_ENABLE_CHECKPOINT_DOWNLOADS:-false}"
            UNCANNY_ALLOWED_HOSTS: "${UNCANNY_ALLOWED_HOSTS:-localhost:${UNCANNY_PORT:-8080},127.0.0.1:${UNCANNY_PORT:-8080},[::1]:${UNCANNY_PORT:-8080}}"
        volumes:
            - "${UNCANNY_DATA_DIR:-./data}:/data"
        tmpfs:
            - /tmp:size=1g,mode=1777
            - /run:size=16m,mode=0755
        ports:
            - "${UNCANNY_BIND_ADDRESS:-127.0.0.1}:${UNCANNY_PORT:-8080}:${UNCANNY_PORT:-8080}"
        healthcheck:
            test: ["CMD", "/usr/local/bin/uncanny-lab", "-healthcheck"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 15s

name: Build and publish

on:
    pull_request:
    push:
        branches: [main]
        tags: ["v*"]

permissions:
    contents: read

jobs:
    test:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
              with:
                  go-version-file: go.mod
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.11"
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - name: Go tests with race detector
              run: go test -race ./...
            - name: Go vet
              run: go vet ./...
            - name: Check Python source syntax
              run: python -m compileall -q python tools
            - name: Build browser assets
              run: bun build web/static/app.js --target browser --outfile /tmp/uncanny-lab-app.js
            - name: Validate Compose stacks
              run: |
                  docker compose -f compose.yaml config --quiet
                  docker compose -f compose.yaml -f compose.cpu.yaml config --quiet
            - id: buildmeta
              name: Record build timestamp
              run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            - name: Build tested Linux amd64 image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: uncanny-lab:test
                  build-args: |
                      VERSION=pr-${{ github.event.pull_request.number }}
                      REVISION=${{ github.sha }}
                      CREATED=${{ steps.buildmeta.outputs.created }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Run source-mounted Python tests in image
              run: >-
                  docker run --rm
                  --mount type=bind,src="${{ github.workspace }}",dst=/workspace,readonly
                  --workdir /workspace
                  --env PYTHONPATH=/workspace/python
                  --entrypoint python3
                  uncanny-lab:test -m unittest discover -s python/tests -v
            - name: Verify the tested final image
              run: tools/verify_image.sh uncanny-lab:test "${{ github.sha }}"

    publish:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
              with:
                  go-version-file: go.mod
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.11"
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - id: metadata
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/uncanny-lab
                  flavor: |
                      latest=false
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=sha,format=long,prefix=
                      type=semver,pattern={{version}}
            - name: Go tests with race detector
              run: go test -race ./...
            - name: Go vet
              run: go vet ./...
            - name: Check Python source syntax
              run: python -m compileall -q python tools
            - name: Build browser assets
              run: bun build web/static/app.js --target browser --outfile /tmp/uncanny-lab-app.js
            - name: Validate Compose stacks
              run: |
                  docker compose -f compose.yaml config --quiet
                  docker compose -f compose.yaml -f compose.cpu.yaml config --quiet
            - id: buildmeta
              name: Record build timestamp
              run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            - name: Build tested Linux amd64 image once
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: uncanny-lab:tested
                  build-args: |
                      VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
                      REVISION=${{ github.sha }}
                      CREATED=${{ steps.buildmeta.outputs.created }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Run source-mounted Python tests in image
              run: >-
                  docker run --rm
                  --mount type=bind,src="${{ github.workspace }}",dst=/workspace,readonly
                  --workdir /workspace
                  --env PYTHONPATH=/workspace/python
                  --entrypoint python3
                  uncanny-lab:tested -m unittest discover -s python/tests -v
            - name: Verify the tested final image
              run: tools/verify_image.sh uncanny-lab:tested "${{ github.sha }}"
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Tag and push the tested image
              env:
                  TAGS: ${{ steps.metadata.outputs.tags }}
              run: |
                  while IFS= read -r tag; do
                      docker tag uncanny-lab:tested "$tag"
                      docker push "$tag"
                  done <<< "$TAGS"

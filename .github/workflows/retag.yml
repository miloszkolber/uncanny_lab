name: Retag existing image

on:
    workflow_dispatch:
        inputs:
            source:
                description: Existing image tag to reuse
                required: true
                type: string
            target:
                description: New semantic-version tag
                required: true
                type: string

concurrency:
    group: uncanny-lab-publish
    cancel-in-progress: false

permissions:
    packages: write

jobs:
    retag:
        runs-on: ubuntu-latest
        steps:
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Validate tags
              env:
                  SOURCE: ${{ inputs.source }}
                  TARGET: ${{ inputs.target }}
              run: |
                  [[ "$SOURCE" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]
                  [[ "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            - name: Validate source metadata and target immutability
              env:
                  IMAGE: ghcr.io/${{ github.repository_owner }}/uncanny-lab
                  SOURCE: ${{ inputs.source }}
                  TARGET: ${{ inputs.target }}
              run: |
                  docker pull "$IMAGE:$SOURCE"
                  version="$(docker image inspect "$IMAGE:$SOURCE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
                  [[ "$version" == "$TARGET" ]]
                  source_digest="$(docker image inspect "$IMAGE:$SOURCE" --format '{{.Id}}')"
                  set +e
                  inspect_output="$(docker manifest inspect "$IMAGE:$TARGET" 2>&1)"
                  inspect_status=$?
                  set -e
                  if [[ "$inspect_status" -eq 0 ]]; then
                      target_digest="$(printf '%s' "$inspect_output" | jq -r '.config.digest // .SchemaV2Manifest.config.digest // empty')"
                      if [[ "$target_digest" == "$source_digest" ]]; then
                          echo "target tag already points to the source image: $TARGET"
                          exit 0
                      fi
                      echo "target tag already points to a different image: $TARGET" >&2
                      exit 1
                  fi
                  if ! [[ "$inspect_output" =~ [Mm]anifest[[:space:]]+unknown|[Nn]o[[:space:]]+such[[:space:]]+manifest ]]; then
                      printf '%s\n' "$inspect_output" >&2
                      exit 1
                  fi
            - name: Retag without rebuilding
              env:
                  IMAGE: ghcr.io/${{ github.repository_owner }}/uncanny-lab
                  SOURCE: ${{ inputs.source }}
                  TARGET: ${{ inputs.target }}
              run: |
                  docker tag "$IMAGE:$SOURCE" "$IMAGE:$TARGET"
                  docker push "$IMAGE:$TARGET"

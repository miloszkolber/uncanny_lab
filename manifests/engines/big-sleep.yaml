id: big-sleep
name: Big Sleep
type: text-to-image
version: 1.2.0
description: Optimizes BigGAN latent and class probabilities through a portable class-conditioned generator under faithful original OpenAI QuickGELU CLIP guidance.
enabled: true
models: [clip-vit-b-32, biggan-generator]
capabilities:
  prompt: true
  seed: true
  iterations: true
  intermediate_frames: true
runtime:
  device: [xpu, cpu]
  precision: [fp32]
parameters:
  prompt: {type: string, title: Prompt, format: textarea, group: Basic, default: "an ImageNet chimera"}
  generator_path: {type: string, title: BigGAN TorchScript generator, group: Basic, default: /data/models/bundle-b/biggan/generator.pt}
  clip_checkpoint: {type: string, title: OpenAI CLIP QuickGELU checkpoint, group: Basic, default: /data/models/bundle-b/clip/vit-b-32.pt}
  clip_model: {type: string, title: CLIP architecture, group: Advanced, default: ViT-B-32}
  class_entropy_weight: {type: number, title: Class entropy penalty, group: Expert, default: 0.01, min: 0, max: 10}
  width: {type: integer, title: Width, group: Basic, default: 256, min: 32, max: 512}
  height: {type: integer, title: Height, group: Basic, default: 256, min: 32, max: 512}
  iterations: {type: integer, title: Iterations, group: Basic, default: 300, min: 1, max: 2000}
  learning_rate: {type: number, title: Learning rate, group: Advanced, default: 0.05, min: 0.00001, max: 1}

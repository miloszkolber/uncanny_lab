id: neural-style
name: Neural Style Transfer
type: image-to-image
version: 1.0.0
description: Optimizes an image against VGG content and style feature statistics.
enabled: true
models: [vgg19-imagenet]
capabilities:
  source_image: true
  style_image: true
  seed: true
  iterations: true
  intermediate_frames: true
required_inputs: [source_image, style_image]
runtime:
  device: [xpu, cpu]
  precision: [fp32]
parameters:
  classifier_path: {type: string, title: VGG19 checkpoint, group: Basic, default: /data/models/bundle-b/classifiers/vgg19.pt}
  width: {type: integer, title: Width, group: Basic, default: 256, min: 32, max: 1024}
  height: {type: integer, title: Height, group: Basic, default: 256, min: 32, max: 1024}
  iterations: {type: integer, title: Iterations, group: Basic, default: 250, min: 1, max: 2000}
  content_weight: {type: number, title: Content weight, group: Advanced, default: 1, min: 0, max: 1000000}
  style_weight: {type: number, title: Style weight, group: Advanced, default: 10000, min: 0, max: 100000000}
  learning_rate: {type: number, title: Learning rate, group: Expert, default: 0.03, min: 0.00001, max: 1}
